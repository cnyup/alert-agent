# alert-agent K8s 部署清单
#
# 目录规划（容器内 /app）：
#   /app/config.yaml   主配置          ← ConfigMap alert-agent-config 挂载
#   /app/skills/       剧本目录        ← ConfigMap alert-agent-skills 挂载（覆盖镜像内置）
#   /app/mcp/          MCP server 配置 ← ConfigMap alert-agent-mcp 挂载
#   /app/data/         SQLite 数据     ← emptyDir（重启丢历史；要持久换 PVC）
#   凭证               不落任何文件     ← Secret alert-agent-secrets 环境变量注入
#
# ⚠️ 必须单副本（replicas: 1）：
#   1) SQLite 是本地文件；2) 飞书长连接每实例独立订阅会重复消费消息。
#   HA 需先外部化状态（PG）与消息消费分组，在路线图上。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-agent-config
data:
  config.yaml: |
    server:
      addr: ":8080"

    llm:
      router: {}                                # 规则路由为主，语义兜底暂未接线
      reasoner:
        base_url: ${LLM_REASONER_BASE_URL}      # 从 Secret 注入的环境变量展开
        model: ${LLM_REASONER_MODEL}
        api_key: ${LLM_REASONER_API_KEY}

    sources:
      - type: webhook
        path: /hooks/alertmanager
        parse: alertmanager
      - type: feishu-app
        app_id: ${FEISHU_APP_ID}
        app_secret: ${FEISHU_APP_SECRET}

    pipeline:
      - stage: aggregate
        window: 5m
        escalate_at: 3
      - stage: silence
        match: "env=staging"
      - stage: route
        rules:
          - name: order-prod
            match: { service: order-api, env: prod }
            severity: critical
            skills: [http-5xx-spike]
            notifiers: [feishu-card, log]

    skills:
      dir: /app/skills                          # ← 挂载点

    mcp:
      dir: /app/mcp                             # ← 挂载点（mcp/<name>.yaml 自动发现）
      servers: {}                               # 内联配置可覆盖同名目录文件

    policy:
      execution: approval-required

    notifiers:
      - type: feishu-card
        app_id: ${FEISHU_APP_ID}
        app_secret: ${FEISHU_APP_SECRET}
        chat_id: ${FEISHU_CHAT_ID}
      - type: log

    store:
      path: /app/data/alert-agent.db

---
# 剧本目录：ConfigMap key 不能带 /，用 volumes.configMap.items 的 path 映射目录树。
# 增加剧本 = 加一个 key + 一条 items 映射。
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-agent-skills
data:
  generic-skill: |
    ---
    name: generic
    description: 通用排查兜底剧本——无专用剧本命中时使用，先收敛事实再定位方向
    severity: []
    tools: []
    ---
    ## 排查思路（通用）

    1. 读懂告警：从标题/描述/labels 判断受影响的 service、env、组件。
    2. 基础健康：查核心指标（QPS/错误率/延迟）与实例存活。
    3. 关联变更：异常起点附近是否有发布、配置变更、依赖故障。
    4. 形成假设：给出 1~3 个根因假设及置信度；无法收敛时列出未解之问并标记 needs_human=true。

    ## 输出要求
    - 结论必须引用工具调用编号（T1、T2…）；
    - summary 开头注明「未命中专用剧本（通用兜底）」。
  http-5xx-spike: |
    ---
    name: http-5xx-spike
    description: HTTP 5xx 错误率飙升类告警的通用排查剧本
    triggers:
      keywords: ["5xx", "错误率", "error rate"]
    severity: [critical, warning]
    tools: []
    ---
    ## 排查步骤
    1. 确认错误率事实与突增起点。
    2. 关联变更：起点前后 30 分钟是否有发布。
    3. 看下游与实例分布。

    ## 判断标准
    - 与发布吻合 → 高置信发布引入，建议回滚。
    - 个别实例集中 → 实例问题，重启缓解。

    ## 输出要求
    结论必须引用工具调用编号（T1、T2…）。

---
# MCP server 配置：一个 key 一个 server（对应 mcp/<name>.yaml）。
# ⚠️ MCP server 可执行文件不要放 ConfigMap（默认 0644 不可执行）：
#   - 二进制 server → bake 进自定义镜像，或放 PVC
#   - 脚本 server   → command 用解释器：python3 /app/mcp/servers/xxx.py
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-agent-mcp
data:
  prometheus.yaml: |
    command: /app/mcp-servers/prom-mcp
    args: ["--addr", "http://prometheus.monitoring:9090"]
  workflow-logs.yaml: |
    command: python3
    args: ["/app/mcp/servers/workflow_logs.py", "--source", "http://logsvc:9200"]
    env:
      LOG_API_KEY: ${MCP_LOG_API_KEY}

---
# 凭证示例：复制为真实文件后填值，勿把真实 Secret 提交进 git
apiVersion: v1
kind: Secret
metadata:
  name: alert-agent-secrets
type: Opaque
stringData:
  LLM_REASONER_BASE_URL: "https://api.siliconflow.cn/v1"
  LLM_REASONER_MODEL: "Qwen/Qwen2.5-72B-Instruct"
  LLM_REASONER_API_KEY: "sk-xxx"
  FEISHU_APP_ID: "cli-xxx"
  FEISHU_APP_SECRET: "xxx"
  FEISHU_CHAT_ID: "oc-xxx"
  MCP_LOG_API_KEY: "xxx"          # mcp/*.yaml 里 ${} 引用的变量同样从环境展开

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-agent
  labels: { app: alert-agent }
spec:
  replicas: 1                     # 必须单副本，见文件头说明
  strategy:
    type: Recreate                # 避免新旧实例同时消费飞书消息
  selector:
    matchLabels: { app: alert-agent }
  template:
    metadata:
      labels: { app: alert-agent }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001            # emptyDir/PVC 以组可写方式挂给 aa
      containers:
        - name: alert-agent
          image: registry.example.com/your-team/alert-agent:latest   # 换成你们镜像仓库地址
          ports: [{ containerPort: 8080, name: http }]
          envFrom:
            - secretRef: { name: alert-agent-secrets }
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: skills
              mountPath: /app/skills
            - name: mcp
              mountPath: /app/mcp
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: alert-agent-config }
        - name: skills
          configMap:
            name: alert-agent-skills
            items:                            # key → 目录树映射
              - { key: generic-skill, path: _generic/SKILL.md }
              - { key: http-5xx-spike, path: http-5xx-spike/SKILL.md }
        - name: mcp
          configMap:
            name: alert-agent-mcp
            items:
              - { key: prometheus.yaml, path: prometheus.yaml }
              - { key: workflow-logs.yaml, path: workflow-logs.yaml }
        - name: data
          emptyDir: {}                        # 要持久化历史（trace/审批/反馈）换 PVC

---
apiVersion: v1
kind: Service
metadata:
  name: alert-agent
spec:
  selector: { app: alert-agent }
  ports:
    - port: 8080
      targetPort: http
      name: http

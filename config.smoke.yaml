# 冒烟测试配置（凭证走同目录 .env，不落 git）
server:
  addr: ":18080"

llm:
  router: {}
  reasoner:
    base_url: ${LLM_REASONER_BASE_URL}
    model: ${LLM_REASONER_MODEL}
    api_key: ${LLM_REASONER_API_KEY}

sources:
  - type: webhook
    path: /hooks/alertmanager
    parse: alertmanager
  - type: feishu-app
    app_id: ${FEISHU_APP_ID}
    app_secret: ${FEISHU_APP_SECRET}

pipeline:
  - stage: dedup
    window: 5m
  - stage: silence
    match: "env=staging"
  - stage: route
    rules:
      - name: order-prod
        match: { service: order-api, env: prod }
        severity: critical
        skills: [http-5xx-spike]
        notifiers: [feishu-card, log]

skills:
  dir: ./skills/examples

mcp:
  servers:
    stub:
      command: ./bin/mcp-stub

policy:
  execution: approval-required

notifiers:
  - type: feishu-card
    app_id: ${FEISHU_APP_ID}
    app_secret: ${FEISHU_APP_SECRET}
    chat_id: ${FEISHU_CHAT_ID}
  - type: log

store:
  path: data/smoke.db
